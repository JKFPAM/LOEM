<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIFE</title>
    <style>
        @font-face {
            font-family: "Test Martina Plantijn";
            src: url("/fonts/TestMartinaPlantijn-Light.otf") format("opentype");
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: "Greed Condensed";
            src: url("/fonts/Greed%20Condensed/GreedCondensed-TRIAL-SemiBold.otf") format("opentype");
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #FFFAF3;
            overflow: hidden;
        }

        canvas {
            position: fixed;
            inset: 0;
            display: block;
            pointer-events: none;
            z-index: 0;
        }

        .scroll-snap {
            position: relative;
            z-index: 1;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }

        .snap-section {
            min-height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        .section-menu {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.54);
            border: 1px solid rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(8px);
        }

        .section-menu__item {
            display: inline-flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            border: 0;
            background: transparent;
            color: rgba(16, 16, 16, 0.7);
            padding: 4px 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 180ms ease, color 180ms ease, transform 180ms ease;
            font: 500 12px/1.2 "Helvetica Neue", Arial, sans-serif;
            letter-spacing: 0.01em;
        }

        .section-menu__item:hover {
            background: rgba(255, 255, 255, 0.66);
            color: rgba(16, 16, 16, 0.92);
        }

        .section-menu__item.is-active {
            background: rgba(255, 255, 255, 0.86);
            color: rgba(0, 0, 0, 0.96);
            transform: translateX(-2px);
        }

        .section-menu__dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.28);
            transition: transform 180ms ease, background 180ms ease;
            flex: 0 0 8px;
        }

        .section-menu__item.is-active .section-menu__dot {
            background: rgba(0, 0, 0, 0.86);
            transform: scale(1.2);
        }

        .top-chrome {
            position: fixed;
            top: 52px;
            left: 28px;
            right: 28px;
            z-index: 4;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            pointer-events: none;
            opacity: 1;
            transform: translateY(0);
            transition: transform 360ms ease, opacity 320ms ease;
        }

        .top-chrome.is-hidden {
            opacity: 0;
            transform: translateY(-18px);
            pointer-events: none;
        }

        .top-chrome__slot {
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        .top-chrome__slot--left {
            justify-content: flex-start;
        }

        .top-chrome__slot--center {
            justify-content: center;
        }

        .top-chrome__slot--right {
            justify-content: flex-end;
        }

        .top-chrome__btn {
            border: 0;
            background: transparent;
            color: #131313;
            font-family: "Greed Condensed", "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            padding: 10px 14px;
            cursor: pointer;
            pointer-events: auto;
            transition: background-color 220ms ease;
        }

        .top-chrome__btn:hover {
            background: #F6E9D7;
        }

        .top-chrome__logo {
            width: clamp(80px, 9.5vw, 140px);
            height: auto;
            display: block;
            pointer-events: none;
        }

        .final-actions {
            position: fixed;
            left: 50%;
            bottom: 60px;
            transform: translate(-50%, 16px);
            z-index: 4;
            display: flex;
            gap: 16px;
            opacity: 0;
            pointer-events: none;
            transition: transform 320ms ease, opacity 280ms ease;
        }

        .final-actions.is-visible {
            transform: translate(-50%, 0);
            opacity: 1;
            pointer-events: auto;
        }

        .final-actions__btn {
            min-width: 180px;
            height: 48px;
            border: 0;
            background: #F6E9D7;
            color: #151515;
            font-family: "Greed Condensed", "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 220ms ease;
        }

        .final-actions__btn:hover {
            background: #FFF2E0;
        }

        @media (max-width: 700px) {
            .top-chrome {
                top: 12px;
                left: 12px;
                right: 12px;
            }

            .top-chrome__btn {
                font-size: 13px;
                padding: 8px 10px;
            }

            .top-chrome__logo {
                width: clamp(55px, 17vw, 80px);
            }

            .section-menu {
                top: 12px;
                right: 12px;
                padding: 8px;
                gap: 6px;
            }

            .section-menu__item {
                font-size: 11px;
            }

            .final-actions {
                width: calc(100% - 24px);
                bottom: 18px;
                gap: 10px;
            }

            .final-actions__btn {
                min-width: 0;
                flex: 1 1 0;
                height: 42px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <div id="topChrome" class="top-chrome" aria-hidden="false">
        <div class="top-chrome__slot top-chrome__slot--left">
            <button class="top-chrome__btn" type="button">Brand Story</button>
        </div>
        <div class="top-chrome__slot top-chrome__slot--center">
            <img class="top-chrome__logo" src="Assets/Wordmark.svg" alt="Loem wordmark">
        </div>
        <div class="top-chrome__slot top-chrome__slot--right">
            <button class="top-chrome__btn" type="button">Look Book</button>
        </div>
    </div>
    <nav id="sectionMenu" class="section-menu" aria-label="Navigation des sections"></nav>
    <div id="finalActions" class="final-actions" aria-hidden="true">
        <button class="final-actions__btn" type="button">Brand Story</button>
        <button class="final-actions__btn" type="button">Brand in Action</button>
    </div>
    <div id="scrollSnap" class="scroll-snap" aria-hidden="true">
        <section class="snap-section"></section>
        <section class="snap-section"></section>
        <section class="snap-section"></section>
        <section class="snap-section"></section>
        <section class="snap-section"></section>
        <section class="snap-section"></section>
        <section class="snap-section"></section>
    </div>
    <script>
        const SECTION_TITLES = [
            "Section 1",
            "Section 2",
            "Section 3",
            "Section 4",
            "Section 5",
            "Section 6",
        ];

        const canvas = document.getElementById('c');
        const scrollSnap = document.getElementById('scrollSnap');
        const topChrome = document.getElementById('topChrome');
        const sectionMenu = document.getElementById('sectionMenu');
        const finalActions = document.getElementById('finalActions');
        const ctx = canvas.getContext('2d');

        // Keep section count in sync with titles.
        scrollSnap.innerHTML = SECTION_TITLES
            .map((title) => `<section class="snap-section" aria-label="${title}"></section>`)
            .join('');
        sectionMenu.innerHTML = SECTION_TITLES
            .map((title, index) => `
                <button class="section-menu__item" type="button" data-section-index="${index}" aria-current="false" aria-label="${title}" title="${title}">
                    <span class="section-menu__label">${index + 1}</span>
                    <span class="section-menu__dot" aria-hidden="true"></span>
                </button>
            `)
            .join('');
        const sectionMenuItems = Array.from(sectionMenu.querySelectorAll('.section-menu__item'));

        let W = 0;
        let H = 0;
        let cx = 0;
        let cy = 0;
        let scrollProgress = 0;
        let renderProgress = 0;
        let targetSpin = 0;
        let currentSpin = 0;
        let activeMenuIndex = -1;

        const BASE_IMAGE_PATHS = [
            "Assets/cosstores_1764409846_3776465965115332144_392125511 1.png",
            "Assets/image 100.png",
            "Assets/image 160.png",
            "Assets/image 161.png",
            "Assets/image 162.png",
            "Assets/image 96.png",
            "Assets/image 97.png",
            "Assets/louisdewynter_1700238665_3238159083012627055_226582794 2.png",
            "Assets/original_0995e3cd9f020f9c3ddb2664d94c8ce0 3.png",
            "Assets/original_b44b8abee530c4056f8962ba2e53b164 5.png",
            "Assets/palet.company_1766388787_3793066521728170133_303443909 2.png",
            "Assets/rvstapleton_1729101960_3480281946918339529_207976621 5.png",
            "Assets/soeur_paris_1763888448_3772092157017208903_539516923 1.png",
            "Assets/zhuchongyun_1770617589_3828540287371930487_33940091205 3.png",
        ];
        const CENTER_LOGO_IMAGE_PATH = "Assets/Loem calligraphy signature.png";
        const CENTER_STEPS = [
            { type: 'text', text: "A modern living practice," },
            { type: 'text', text: "redefining daily essentials—for flow." },
            { type: 'text', text: "Where the mind awakens" },
            { type: 'text', text: "The self dissolves" },
            { type: 'text', text: "And everything moves effortlessly" },
            { type: 'image', imagePath: CENTER_LOGO_IMAGE_PATH },
        ];
        const CENTER_SLIDE_DISTANCE_RATIO = 0.36;

        const CARDS_PER_SECTION = 10;
        const SECTION_COUNT = SECTION_TITLES.length;
        const TOTAL_TURNS = 0.3;
        const TILT_X = 14 * Math.PI / 180;
        const PHASE_PER_SECTION = Math.PI * 0.4;
        const CENTER_DEPTH = 0.5;
        const MAX_OPACITY = 0.8;
        const MIN_CARD_VISIBILITY = 0.54;
        const MAX_CARD_VISIBILITY = 0.98;
        const PROGRESS_LERP_BASE = 0.86;
        const SPIN_LERP_BASE = 0.88;
        const WORLD_RADIUS = 0.57;
        const HORIZONTAL_SPREAD = 1.9;
        const CARD_SIZE_BOOST = 1.68;
        const CORNER_BOOST_X_STRONG = 1.28;
        const CORNER_BOOST_Y_STRONG = 1.18;
        const CORNER_BOOST_X_SOFT = 1.14;
        const CORNER_BOOST_Y_SOFT = 1.08;
        const PHI = Math.PI * (3 - Math.sqrt(5));
        const cosT = Math.cos(TILT_X);
        const sinT = Math.sin(TILT_X);

        function smoothstep(v) {
            const t = Math.max(0, Math.min(1, v));
            return t * t * (3 - 2 * t);
        }

        function clamp(v, min, max) {
            return Math.max(min, Math.min(max, v));
        }

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = `${W}px`;
            canvas.style.height = `${H}px`;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            cx = W / 2;
            cy = H / 2;
        }

        function updateScrollProgress() {
            const max = Math.max(1, scrollSnap.scrollHeight - scrollSnap.clientHeight);
            scrollProgress = scrollSnap.scrollTop / max;
        }

        function sectionPhase(index) {
            return index * PHASE_PER_SECTION;
        }

        function updateSectionMenu(sectionFloat) {
            const nextActive = clamp(Math.round(sectionFloat), 0, SECTION_TITLES.length - 1);
            if (nextActive === activeMenuIndex) return;
            activeMenuIndex = nextActive;

            sectionMenuItems.forEach((item, index) => {
                const isActive = index === activeMenuIndex;
                item.classList.toggle('is-active', isActive);
                item.setAttribute('aria-current', isActive ? 'true' : 'false');
            });
        }

        function updateFinalActions(sectionFloat) {
            const threshold = SECTION_TITLES.length - 1.05;
            const isVisible = sectionFloat >= threshold;
            finalActions.classList.toggle('is-visible', isVisible);
            finalActions.setAttribute('aria-hidden', isVisible ? 'false' : 'true');
        }

        function updateTopChrome(sectionFloat) {
            const threshold = SECTION_TITLES.length - 1.05;
            const isHidden = sectionFloat >= threshold;
            topChrome.classList.toggle('is-hidden', isHidden);
            topChrome.setAttribute('aria-hidden', isHidden ? 'true' : 'false');
        }

        function createImageAsset(path) {
            const img = new Image();
            img.decoding = 'async';
            img.loading = 'eager';
            img.src = encodeURI(path);
            return img;
        }

        const baseAssets = BASE_IMAGE_PATHS.map((path) => createImageAsset(path));
        const centerLogoAsset = createImageAsset(CENTER_LOGO_IMAGE_PATH);

        const particles = Array.from({ length: CARDS_PER_SECTION }, (_, i) => {
            // Use midpoint sampling so first/last cards are not stuck on the poles.
            const y = 1 - ((i + 0.5) / CARDS_PER_SECTION) * 2;
            const r = Math.sqrt(Math.max(0, 1 - y * y));
            const theta = PHI * i;
            const baseW = 148 + (i % 4) * 16;
            const baseH = baseW * (1.25 + (i % 3) * 0.08);
            const edgeSeed = (i * 17 + 11) % 12;
            let orbitX = 1;
            let orbitY = 1;
            if (edgeSeed < 4) {
                orbitX = CORNER_BOOST_X_STRONG;
                orbitY = CORNER_BOOST_Y_STRONG;
            } else if (edgeSeed < 7) {
                orbitX = CORNER_BOOST_X_SOFT;
                orbitY = CORNER_BOOST_Y_SOFT;
            }
            return {
                x: r * Math.cos(theta),
                y: y * 0.66,
                z: r * Math.sin(theta),
                baseW,
                baseH,
                orbitX,
                orbitY,
                slot: i,
            };
        });

        const baseMediaOrder = (() => {
            const total = baseAssets.length;
            const step = 5;
            const seed = 1;
            return Array.from({ length: CARDS_PER_SECTION }, (_, slot) => {
                const imageIndex = (seed + slot * step) % total;
                return {
                    img: baseAssets[imageIndex],
                    assetPath: BASE_IMAGE_PATHS[imageIndex],
                    flipX: (slot % 3) === 0,
                    flipY: (slot % 5) === 0,
                    label: String(slot + 1).padStart(2, '0'),
                };
            });
        })();

        function createSectionMedia() {
            const media = baseMediaOrder.map((item) => ({ ...item }));
            if (media[2]) {
                media[2] = {
                    ...media[2],
                    shiftXPx: -300,
                };
            }
            if (media[4]) {
                media[4] = {
                    ...media[4],
                    shiftXPx: -200,
                    shiftYPx: 100,
                };
            }
            if (media[6]) {
                media[6] = {
                    ...media[6],
                    shiftXPx: 620,
                    shiftYPx: -70,
                };
            }
            return media;
        }

        const sectionMedia = SECTION_TITLES.map(() => createSectionMedia());

        function drawCard(media, sx, sy, w, h, opacity, blur) {
            if (opacity < 0.01) return;
            ctx.save();
            ctx.globalAlpha = opacity;
            const cardBlur = media.disableBlur ? 0 : blur;
            if (cardBlur > 0.2) ctx.filter = `blur(${cardBlur.toFixed(2)}px)`;
            const hw = w / 2;
            const hh = h / 2;
            if (!media.transparentBg) {
                ctx.fillStyle = '#d9d2c8';
                ctx.fillRect(sx - hw, sy - hh, w, h);
            }
            ctx.save();
            ctx.beginPath();
            ctx.rect(sx - hw, sy - hh, w, h);
            ctx.clip();
            const img = media.img;
            const loaded = img && img.complete && img.naturalWidth > 0;
            if (loaded) {
                const s = media.fitMode === 'contain'
                    ? Math.min(w / img.naturalWidth, h / img.naturalHeight)
                    : Math.max(w / img.naturalWidth, h / img.naturalHeight);
                const drawW = img.naturalWidth * s;
                const drawH = img.naturalHeight * s;

                if (media.flipX || media.flipY) {
                    ctx.translate(sx, sy);
                    ctx.scale(media.flipX ? -1 : 1, media.flipY ? -1 : 1);
                    ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
                } else {
                    ctx.drawImage(img, sx - drawW / 2, sy - drawH / 2, drawW, drawH);
                }
            } else {
                ctx.fillStyle = media.transparentBg ? 'rgba(255,255,255,0.35)' : '#c8c1b6';
                ctx.fillRect(sx - hw, sy - hh, w, h);
                if (media.transparentBg) {
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.24)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(sx - hw, sy - hh, w, h);
                }
            }

            const badgeMargin = Math.max(5, w * 0.035);
            const badgeHeight = Math.max(20, Math.min(30, h * 0.18));
            const badgeWidth = Math.max(34, Math.min(52, w * 0.34));
            const badgeX = sx - hw + badgeMargin;
            const badgeY = sy - hh + badgeMargin;
            const fontSize = Math.max(12, Math.min(18, h * 0.17));
            const badgeRadius = Math.min(8, badgeHeight * 0.35);

            ctx.filter = 'none';
            ctx.globalAlpha = 1;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.26)';
            ctx.shadowBlur = 6;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.beginPath();
            ctx.moveTo(badgeX + badgeRadius, badgeY);
            ctx.lineTo(badgeX + badgeWidth - badgeRadius, badgeY);
            ctx.quadraticCurveTo(badgeX + badgeWidth, badgeY, badgeX + badgeWidth, badgeY + badgeRadius);
            ctx.lineTo(badgeX + badgeWidth, badgeY + badgeHeight - badgeRadius);
            ctx.quadraticCurveTo(badgeX + badgeWidth, badgeY + badgeHeight, badgeX + badgeWidth - badgeRadius, badgeY + badgeHeight);
            ctx.lineTo(badgeX + badgeRadius, badgeY + badgeHeight);
            ctx.quadraticCurveTo(badgeX, badgeY + badgeHeight, badgeX, badgeY + badgeHeight - badgeRadius);
            ctx.lineTo(badgeX, badgeY + badgeRadius);
            ctx.quadraticCurveTo(badgeX, badgeY, badgeX + badgeRadius, badgeY);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.95)';
            ctx.font = `700 ${fontSize}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`#${media.label || '00'}`, badgeX + badgeWidth / 2, badgeY + badgeHeight / 2 + 0.5);
            ctx.restore();
            ctx.restore();
        }

        function drawBadgeOverlay(media, sx, sy, w, h, opacity) {
            if (opacity < 0.03) return;
            const hw = w / 2;
            const hh = h / 2;
            const badgeMargin = Math.max(5, w * 0.035);
            const badgeHeight = Math.max(20, Math.min(30, h * 0.18));
            const badgeWidth = Math.max(34, Math.min(52, w * 0.34));
            const badgeX = sx - hw + badgeMargin;
            const badgeY = sy - hh + badgeMargin;
            const fontSize = Math.max(12, Math.min(18, h * 0.17));
            const badgeRadius = Math.min(8, badgeHeight * 0.35);

            ctx.save();
            ctx.filter = 'none';
            ctx.globalAlpha = 1;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.22)';
            ctx.shadowBlur = 4;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.98)';
            ctx.beginPath();
            ctx.moveTo(badgeX + badgeRadius, badgeY);
            ctx.lineTo(badgeX + badgeWidth - badgeRadius, badgeY);
            ctx.quadraticCurveTo(badgeX + badgeWidth, badgeY, badgeX + badgeWidth, badgeY + badgeRadius);
            ctx.lineTo(badgeX + badgeWidth, badgeY + badgeHeight - badgeRadius);
            ctx.quadraticCurveTo(badgeX + badgeWidth, badgeY + badgeHeight, badgeX + badgeWidth - badgeRadius, badgeY + badgeHeight);
            ctx.lineTo(badgeX + badgeRadius, badgeY + badgeHeight);
            ctx.quadraticCurveTo(badgeX, badgeY + badgeHeight, badgeX, badgeY + badgeHeight - badgeRadius);
            ctx.lineTo(badgeX, badgeY + badgeRadius);
            ctx.quadraticCurveTo(badgeX, badgeY, badgeX + badgeRadius, badgeY);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.78)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.98)';
            ctx.font = `700 ${fontSize}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`#${media.label || '00'}`, badgeX + badgeWidth / 2, badgeY + badgeHeight / 2 + 0.5);
            ctx.restore();
        }

        function projectLayer(sectionIndex, spinRad, phaseOffset, layerAlpha) {
            const cosS = Math.cos(spinRad + phaseOffset);
            const sinS = Math.sin(spinRad + phaseOffset);
            const R = Math.min(W, H) * WORLD_RADIUS;

            return particles.map((p) => {
                const rx = p.x * cosS - p.z * sinS;
                const ry = p.y;
                const rz = p.x * sinS + p.z * cosS;
                const fy = ry * cosT - rz * sinT;
                const fz = ry * sinT + rz * cosT;

                const rawSx = cx + rx * R * HORIZONTAL_SPREAD * p.orbitX;
                const rawSy = cy + fy * R * p.orbitY;
                const depth = (fz + 1) / 2;
                const media = sectionMedia[sectionIndex][p.slot];
                const shiftX = ((media.shiftXRatio || 0) * W) + (media.shiftXPx || 0);
                const shiftY = ((media.shiftYRatio || 0) * H) + (media.shiftYPx || 0);
                const mediaScale = media.scale || 1;
                const sizeF = (0.38 + depth * 0.95) * CARD_SIZE_BOOST;
                const w = p.baseW * sizeF * mediaScale;
                const h = p.baseH * sizeF * mediaScale;
                const sx = rawSx + shiftX;
                const sy = rawSy + shiftY;

                const boostedDepth = clamp(depth + (media.layerBoost || 0), 0, 1);
                const renderDepth = media.forceFront ? 2 + boostedDepth : boostedDepth;
                const nt = smoothstep(boostedDepth);
                const visibility = MIN_CARD_VISIBILITY + (MAX_CARD_VISIBILITY - MIN_CARD_VISIBILITY) * nt;
                const baseOpacity = visibility * MAX_OPACITY;
                const opacity = clamp((media.forceOpacity ?? baseOpacity) * layerAlpha, 0, 1);
                const blur = (1 - nt) * 1.3;

                return {
                    sx,
                    sy,
                    w,
                    h,
                    depth: renderDepth,
                    opacity,
                    blur,
                    media,
                };
            });
        }

        function onScroll() {
            updateScrollProgress();
        }

        function buildCenteredLines(text, maxWidth) {
            const words = text.split(/\s+/);
            let line = '';
            const lines = [];
            for (let i = 0; i < words.length; i += 1) {
                const testLine = line ? `${line} ${words[i]}` : words[i];
                if (ctx.measureText(testLine).width > maxWidth && line) {
                    lines.push(line);
                    line = words[i];
                } else {
                    line = testLine;
                }
            }
            if (line) {
                lines.push(line);
            }
            return lines;
        }

        function drawCenterStep(step, centerX, alpha) {
            if (!step || alpha < 0.01) return;
            ctx.save();
            ctx.globalAlpha = clamp(alpha, 0, 1);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(17, 17, 17, 0.98)';
            ctx.shadowColor = 'rgba(0,0,0,0.08)';
            ctx.shadowBlur = 8;

            if (step.type === 'image') {
                const img = centerLogoAsset;
                const loaded = img && img.complete && img.naturalWidth > 0;
                if (loaded) {
                    const targetW = clamp(W * 0.3, 132, 372);
                    const targetH = clamp(H * 0.144, 54, 144);
                    const scale = Math.min(targetW / img.naturalWidth, targetH / img.naturalHeight);
                    const drawW = img.naturalWidth * scale;
                    const drawH = img.naturalHeight * scale;
                    ctx.drawImage(img, centerX - drawW / 2, cy - drawH / 2, drawW, drawH);
                }
                ctx.restore();
                return;
            }

            const text = (step.text || '').trim();
            const fontSize = clamp(W * 0.0213, 16, 38);
            const lineHeight = Math.round(fontSize * 1.1);
            const maxWidth = clamp(W * 0.72, 320, 1060);
            ctx.font = `300 ${fontSize}px "Test Martina Plantijn", Georgia, "Times New Roman", serif`;
            const lines = buildCenteredLines(text, maxWidth);
            const startY = cy - ((lines.length - 1) * lineHeight) / 2;
            lines.forEach((line, idx) => {
                ctx.fillText(line, centerX, startY + idx * lineHeight);
            });
            ctx.restore();
        }

        function drawCenterTransition(currentIndex, nextIndex, mix) {
            const currentStep = CENTER_STEPS[currentIndex];
            const nextStep = CENTER_STEPS[nextIndex];
            const slideDistance = clamp(W * CENTER_SLIDE_DISTANCE_RATIO, 180, 460);
            const inShift = slideDistance * (1 - mix);
            const outShift = slideDistance * mix;
            const currentX = cx - outShift;
            const nextX = cx + inShift;

            drawCenterStep(currentStep, currentX, 1 - mix);
            if (nextIndex !== currentIndex) {
                drawCenterStep(nextStep, nextX, mix);
            }
        }

        function drawCenterStepper(sectionFloat) {
            const totalSteps = SECTION_TITLES.length;
            if (totalSteps <= 1) return;

            const progress = clamp(sectionFloat / (totalSteps - 1), 0, 1);
            const fadeOutStart = totalSteps - 1.15;
            const alpha = sectionFloat >= fadeOutStart
                ? clamp((totalSteps - 1 - sectionFloat) / (totalSteps - 1 - fadeOutStart), 0, 1)
                : 1;
            if (alpha <= 0.001) return;
            const trackW = clamp(W * 0.12, 110, 230);
            const trackH = 2;
            const x = cx - trackW / 2;
            const y = cy + clamp(H * 0.06, 42, 78);
            const fillW = Math.max(2, trackW * progress);

            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.16)';
            ctx.fillRect(x, y, trackW, trackH);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
            ctx.fillRect(x, y, fillW, trackH);
            ctx.restore();
        }

        sectionMenuItems.forEach((item) => {
            item.addEventListener('click', () => {
                const sectionIndex = Number(item.dataset.sectionIndex || 0);
                const sectionTarget = scrollSnap.clientHeight * sectionIndex;
                scrollSnap.scrollTo({ top: sectionTarget, behavior: 'smooth' });
            });
        });

        let lastTime = performance.now();
        function frame(now) {
            const dt = Math.min(now - lastTime, 50);
            lastTime = now;

            const progressLf = 1 - Math.pow(PROGRESS_LERP_BASE, dt / 16.67);
            renderProgress += (scrollProgress - renderProgress) * progressLf;
            targetSpin = renderProgress * Math.PI * 2 * TOTAL_TURNS;

            const spinLf = 1 - Math.pow(SPIN_LERP_BASE, dt / 16.67);
            currentSpin += (targetSpin - currentSpin) * spinLf;

            const sectionFloat = renderProgress * (SECTION_TITLES.length - 1);
            const currentIndex = Math.floor(sectionFloat);
            const nextIndex = Math.min(currentIndex + 1, SECTION_TITLES.length - 1);
            const mix = smoothstep(sectionFloat - currentIndex);
            updateSectionMenu(sectionFloat);
            updateFinalActions(sectionFloat);
            updateTopChrome(sectionFloat);
            const phaseCurrent = sectionPhase(currentIndex);
            const phaseNext = sectionPhase(nextIndex);
            const blendedPhase = phaseCurrent + (phaseNext - phaseCurrent) * mix;
            const allCards = projectLayer(0, currentSpin, blendedPhase, 1).sort((a, b) => a.depth - b.depth);

            ctx.clearRect(0, 0, W, H);

            allCards
                .filter((card) => card.depth < CENTER_DEPTH)
                .forEach((card) => drawCard(card.media, card.sx, card.sy, card.w, card.h, card.opacity, card.blur));

            drawCenterTransition(currentIndex, nextIndex, mix);
            drawCenterStepper(sectionFloat);

            allCards
                .filter((card) => card.depth >= CENTER_DEPTH)
                .forEach((card) => drawCard(card.media, card.sx, card.sy, card.w, card.h, card.opacity, card.blur));

            // Keep numbering always readable on top of everything.
            allCards.forEach((card) => {
                drawBadgeOverlay(card.media, card.sx, card.sy, card.w, card.h, card.opacity);
            });

            requestAnimationFrame(frame);
        }

        resize();
        updateScrollProgress();
        renderProgress = scrollProgress;
        targetSpin = renderProgress * Math.PI * 2 * TOTAL_TURNS;
        currentSpin = targetSpin;
        scrollSnap.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', () => {
            resize();
            updateScrollProgress();
        });
        scrollSnap.scrollTo({ top: 0, behavior: 'auto' });
        requestAnimationFrame(frame);
    </script>
</body>

</html>
